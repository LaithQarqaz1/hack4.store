<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>إعادة ضبط كلمة المرور</title>
  <meta name="color-scheme" content="light dark">
  <script>
    (function () {
      "use strict";
      // Capture once, before any external resource. Keep the credential only in
      // this private closure, never storage, DOM, history.state or a global.
      const state = (function () {
        const fragment = new URLSearchParams(String(window.location.hash || "").replace(/^#/, ""));
        const params = fragment.has("mode") || fragment.has("oobCode")
          ? fragment : new URLSearchParams(window.location.search || "");
        return {
          mode: String(params.get("mode") || "").trim(),
          oobCode: String(params.get("oobCode") || "").trim(),
          lang: String(params.get("lang") || "ar").trim() || "ar",
          verified: false, submitting: false, email: "", generation: 0
        };
      })();
      if (window.location.search || window.location.hash) {
        try { window.history.replaceState(null, "", window.location.pathname); } catch (_) {}
        if (window.location.search || window.location.hash) {
          state.oobCode = "";
          try { window.location.replace(window.location.pathname); } catch (_) {}
          return;
        }
      }
      function mountResetPage() {
        const els = {
          statusWrap: document.getElementById("statusWrap"),
          statusBadge: document.getElementById("statusBadge"),
          modeLabel: document.getElementById("modeLabel"),
          cardSubtitle: document.getElementById("cardSubtitle"),
          errorBox: document.getElementById("errorBox"),
          formPage: document.getElementById("resetFormPage"),
          successPage: document.getElementById("resetSuccessPage"),
          emailChip: document.getElementById("emailChip"),
          emailValue: document.getElementById("emailValue"),
          resetEmailHidden: document.getElementById("resetEmailHidden"),
          resetForm: document.getElementById("resetForm"),
          newPassword: document.getElementById("newPassword"),
          confirmPassword: document.getElementById("confirmPassword"),
          submitBtn: document.getElementById("submitBtn"),
          backLoginBtn: document.getElementById("backLoginBtn"),
          strengthText: document.getElementById("strengthText"),
          successActions: document.getElementById("successActions"),
          successLoginBtn: document.getElementById("successLoginBtn")
        };

        function buildLoginUrl() {
          const target = new URL("index.html", window.location.href);
          target.search = "";
          target.hash = "/login";
          return target.href;
        }

        function redirectToLogin() {
          const target = buildLoginUrl();
          try {
            window.location.replace(target);
            return;
          } catch (_) {}
          try {
            window.location.href = target;
            return;
          } catch (_) {}
          try {
            window.location.pathname = "/index.html";
            window.location.hash = "#/login";
          } catch (_) {}
        }

        function setStatus(text, tone) {
          if (!els.statusBadge) return;
          const hasText = !!String(text || "").trim();
          if (els.statusWrap) els.statusWrap.classList.toggle("hidden", !hasText);
          els.statusBadge.textContent = hasText ? text : "";
          els.statusBadge.dataset.tone = tone || "loading";
        }

        function buildAuthUrl() {
          const base = typeof window.__getSiteWorkerBase === "function"
            ? window.__getSiteWorkerBase({ trailingSlash: true, allowStorageOverride: false })
            : window.location.origin + "/";
          const url = new URL(base, window.location.origin);
          if (!/^https?:$/i.test(url.protocol) || url.username || url.password ||
              (window.location.protocol === "https:" && url.protocol !== "https:")) throw new Error("auth_backend_unavailable");
          url.searchParams.set("action", "auth");
          return url.toString();
        }

        async function callResetAuth(action, extra) {
          const response = await fetch(buildAuthUrl(), {
            method: "POST",
            credentials: "include",
            cache: "no-store",
            referrerPolicy: "no-referrer",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(Object.assign({}, extra || {}, { action: action, oobCode: state.oobCode }))
          });
          const data = await response.json().catch(function () { return {}; });
          if (!response.ok || !data || typeof data !== "object" || Array.isArray(data) || data.ok === false || data.success === false) {
            const error = new Error(data && (data.message || data.error) || "reset_failed");
            error.code = String(data && data.code || "");
            throw error;
          }
          if ((action === "password_reset_verify" &&
               (typeof data.email !== "string" || data.email.length > 254 || !/^[^\s@<>\u0000-\u001f\u007f]+@[^\s@<>\u0000-\u001f\u007f]+\.[^\s@<>\u0000-\u001f\u007f]{2,}$/.test(data.email))) ||
              (action === "password_reset_confirm" && data.changed !== true)) {
            throw new Error("reset_response_invalid");
          }
          return data;
        }

        function setBusy(busy) {
          if (!els.submitBtn) return;
          els.submitBtn.disabled = !!busy;
          els.submitBtn.textContent = busy ? "جارٍ الحفظ..." : "حفظ كلمة المرور الجديدة";
        }

        function showMessage(el, text, type) {
          if (!el) return;
          el.textContent = text || "";
          el.className = "message " + (type || "error") + (text ? " show" : "");
        }

        function clearMessages() {
          showMessage(els.errorBox, "", "error");
        }

        let fallbackErrorTimer = null;
        function showFormError(text, error) {
          showMessage(els.errorBox, "", "error");
          setStatus("", "loading");
          if (typeof window.__siteFormError === "function") {
            window.__siteFormError(els.errorBox, text, { error: error });
            return;
          }
          if (typeof window.__siteNotifyError === "function") {
            window.__siteNotifyError(text, { error: error });
            return;
          }
          if (error && error.__siteErrorHandled === true) return;
          // The reset form also remains usable when the main storefront bundle fails.
          let toast = document.getElementById("site-form-error-toast");
          if (!toast) {
            toast = document.createElement("div");
            toast.id = "site-form-error-toast";
            toast.className = "toast app-toast app-toast--error";
            toast.setAttribute("role", "alert");
            toast.setAttribute("aria-live", "assertive");
            toast.setAttribute("aria-atomic", "true");
            Object.assign(toast.style, {
              position: "fixed", left: "50%", right: "auto", top: "auto", bottom: "max(18px, env(safe-area-inset-bottom))",
              transform: "translateX(-50%)", zIndex: "2147483647", maxWidth: "min(92vw, 680px)",
              boxSizing: "border-box", padding: "12px 22px", borderRadius: "12px", borderLeft: "4px solid #ef4444",
              background: "#450a0a", color: "#fecaca", fontFamily: "inherit", fontWeight: "700", lineHeight: "1.5",
              direction: "rtl", textAlign: "right", overflowWrap: "anywhere", boxShadow: "0 12px 28px rgba(0,0,0,.18)"
            });
            const message = document.createElement("p");
            message.className = "toast-message";
            message.style.margin = "0";
            toast.appendChild(message);
            document.body.appendChild(toast);
          }
          toast.querySelector(".toast-message").textContent = String(text || "");
          toast.classList.add("is-visible");
          toast.style.visibility = "visible";
          toast.style.opacity = "1";
          clearTimeout(fallbackErrorTimer);
          fallbackErrorTimer = setTimeout(function () {
            toast.classList.remove("is-visible");
            toast.style.visibility = "hidden";
            toast.style.opacity = "0";
          }, 4500);
        }

        function normalizeActionError(err) {
          const direct = String((err && err.code) || "").trim();
          if (direct) return direct.toLowerCase();
          const message = String((err && err.message) || "").trim().toLowerCase();
          if (message.includes("expired-action-code")) return "auth/expired-action-code";
          if (message.includes("invalid-action-code")) return "auth/invalid-action-code";
          if (message.includes("weak-password")) return "auth/weak-password";
          if (message.includes("network-request-failed")) return "auth/network-request-failed";
          return message || "unknown";
        }

        function translateActionError(err) {
          const code = normalizeActionError(err);
          if (code === "auth/expired-action-code") return "انتهت صلاحية رابط إعادة ضبط كلمة المرور. اطلب رابطًا جديدًا من صفحة الدخول.";
          if (code === "auth/invalid-action-code") return "رابط إعادة ضبط كلمة المرور غير صالح أو تم استخدامه مسبقًا.";
          if (code === "auth/user-disabled" || code === "auth/disabled") return "هذا الحساب معطل حاليًا. تواصل مع الدعم إذا كنت ترى أن هذا خطأ.";
          if (code === "auth/weak-password") return "كلمة المرور الجديدة ضعيفة جدًا. استخدم 6 أحرف على الأقل.";
          if (code === "auth/google-account-required") return "تعذر إتمام الطلب. هذا الحساب مربوط حصرياً من خلال خدمة تسجيل الدخول عبر Google، وليست له كلمة مرور مسجلة داخل النظام لتغييرها.";
          if (code === "auth/password-reset-unavailable") return "تعذر إكمال استعادة كلمة المرور. اطلب رابطًا جديدًا من صفحة الدخول وحاول مجددًا.";
          if (code === "auth/network-request-failed") return "تعذر الاتصال بالخادم الآن. تحقق من الإنترنت ثم أعد المحاولة.";
          return "تعذر إكمال العملية الآن. جرّب مرة أخرى أو اطلب رابط استعادة جديدًا.";
        }

        function computeStrength(password) {
          const value = String(password || "");
          let score = 0;
          if (value.length >= 6) score += 1;
          if (value.length >= 10) score += 1;
          if (/[A-Z]/.test(value) || /[\u0600-\u06FF]/.test(value)) score += 1;
          if (/\d/.test(value)) score += 1;
          if (/[^A-Za-z0-9\u0600-\u06FF]/.test(value)) score += 1;
          if (score <= 2) return { label: "ضعيفة", level: "weak" };
          if (score <= 4) return { label: "متوسطة", level: "medium" };
          return { label: "قوية", level: "strong" };
        }

        function updateStrength() {
          if (!els.strengthText || !els.newPassword) return;
          const strength = computeStrength(els.newPassword.value);
          els.strengthText.textContent = "قوة كلمة المرور: " + strength.label;
          els.strengthText.dataset.level = strength.level;
        }

        function validatePasswords() {
          const password = String((els.newPassword && els.newPassword.value) || "");
          const confirm = String((els.confirmPassword && els.confirmPassword.value) || "");
          if (!password.trim()) return "أدخل كلمة المرور الجديدة أولًا.";
          if (password.length < 6) return "يجب ألا تقل كلمة المرور عن 6 أحرف.";
          if (!confirm.trim()) return "أعد كتابة كلمة المرور للتأكيد.";
          if (password !== confirm) return "كلمتا المرور غير متطابقتين.";
          return "";
        }

        function revealReadyState(email) {
          state.email = email || "";
          if (els.emailChip) els.emailChip.classList.remove("hidden");
          if (els.emailValue) els.emailValue.textContent = state.email || "غير معروف";
          if (els.resetEmailHidden) els.resetEmailHidden.value = state.email || "";
          if (els.resetForm) els.resetForm.classList.remove("hidden");
          if (els.cardSubtitle) {
            els.cardSubtitle.textContent = "أدخل كلمة المرور الجديدة ثم احفظها مباشرة. بعد النجاح يمكنك الرجوع إلى تسجيل الدخول.";
          }
          setStatus("", "success");
        }

        function revealSuccess() {
          clearMessages();
          setStatus("", "success");
          if (els.resetForm) els.resetForm.classList.add("hidden");
          if (els.emailChip) els.emailChip.classList.add("hidden");
          if (els.emailValue) els.emailValue.textContent = "";
          if (els.resetEmailHidden) els.resetEmailHidden.value = "";
          if (els.formPage) els.formPage.classList.add("hidden");
          if (els.successActions) els.successActions.classList.remove("hidden");
          if (els.successPage) {
            els.successPage.classList.remove("hidden");
            try { els.successPage.focus({ preventScroll: true }); } catch (_) {}
          }
          document.title = "تم تغيير كلمة السر بنجاح";
          try { window.scrollTo(0, 0); } catch (_) {}
        }

        function ownsResetRequest(owner) {
          return owner.generation === state.generation && owner.code === state.oobCode;
        }

        async function boot() {
          state.generation++;
          state.verified = false;
          clearMessages();
          document.title = "إعادة ضبط كلمة المرور";
          if (els.modeLabel) els.modeLabel.textContent = "إعادة ضبط كلمة المرور";

          if (!state.mode || state.mode !== "resetPassword") {
            showFormError("هذه الصفحة مخصصة فقط لروابط إعادة ضبط كلمة المرور.");
            if (els.cardSubtitle) els.cardSubtitle.textContent = "هذه الصفحة مخصصة فقط لروابط إعادة ضبط كلمة المرور.";
            return;
          }

          if (!state.oobCode) {
            showFormError("رمز التحقق غير موجود داخل الرابط. اطلب رسالة جديدة من صفحة الدخول.");
            return;
          }

          const owner = { generation: state.generation, code: state.oobCode };
          setStatus("جاري التحقق من الرابط...", "loading");
          try {
            const result = await callResetAuth("password_reset_verify");
            if (!ownsResetRequest(owner)) return;
            if (!result.email) throw new Error("reset_email_missing");
            state.verified = true;
            revealReadyState(result.email);
            if (els.newPassword) {
              setTimeout(function () {
                if (!ownsResetRequest(owner)) return;
                try { els.newPassword.focus(); } catch (_) {}
              }, 60);
            }
          } catch (err) {
            if (!ownsResetRequest(owner)) return;
            showFormError(translateActionError(err), err);
          }
        }

        async function submitReset(event) {
          event.preventDefault();
          if (!state.verified || state.submitting) return;
          clearMessages();
          const validationMessage = validatePasswords();
          if (validationMessage) {
            showFormError(validationMessage);
            return;
          }
          state.submitting = true;
          const owner = { generation: state.generation, code: state.oobCode };
          setBusy(true);
          setStatus("جارٍ تحديث كلمة المرور...", "loading");
          try {
            await callResetAuth("password_reset_confirm", { newPassword: String(els.newPassword.value || "") });
            if (!ownsResetRequest(owner)) return;
            state.verified = false;
            state.oobCode = "";
            els.newPassword.value = "";
            els.confirmPassword.value = "";
            try { window.history.replaceState(null, "", window.location.pathname); } catch (_) {}
            revealSuccess();
          } catch (err) {
            if (!ownsResetRequest(owner)) return;
            showFormError(translateActionError(err), err);
          } finally {
            if (owner.generation === state.generation) {
              state.submitting = false;
              setBusy(false);
            }
          }
        }

        document.querySelectorAll("[data-toggle-target]").forEach(function (button) {
          button.addEventListener("click", function () {
            const targetId = String(button.getAttribute("data-toggle-target") || "").trim();
            const input = targetId ? document.getElementById(targetId) : null;
            if (!input) return;
            const nextType = input.type === "password" ? "text" : "password";
            input.type = nextType;
            const icon = button.querySelector("i");
            const isHidden = nextType === "password";
            button.setAttribute("aria-pressed", isHidden ? "false" : "true");
            button.setAttribute("aria-label", isHidden ? "إظهار كلمة المرور" : "إخفاء كلمة المرور");
            button.setAttribute("title", isHidden ? "إظهار كلمة المرور" : "إخفاء كلمة المرور");
            if (icon) {
              icon.className = isHidden ? "fa-regular fa-eye" : "fa-regular fa-eye-slash";
            }
          });
        });

        if (els.newPassword) els.newPassword.addEventListener("input", updateStrength);
        if (els.resetForm) els.resetForm.addEventListener("submit", submitReset);

        function startPage() {
          updateStrength();
          boot();
        }

        window.addEventListener("pagehide", function () {
          state.generation++;
          state.oobCode = "";
          state.verified = false;
          state.submitting = false;
          setBusy(false);
          if (els.newPassword) els.newPassword.value = "";
          if (els.confirmPassword) els.confirmPassword.value = "";
        });
        window.addEventListener("pageshow", function (event) {
          if (!event.persisted) return;
          if (els.resetForm) els.resetForm.classList.add("hidden");
          if (els.successActions) els.successActions.classList.add("hidden");
          if (els.successPage) els.successPage.classList.add("hidden");
          if (els.formPage) els.formPage.classList.remove("hidden");
          boot();
        });

        if (els.backLoginBtn) {
          els.backLoginBtn.addEventListener("click", redirectToLogin);
        }
        if (els.successLoginBtn) {
          els.successLoginBtn.addEventListener("click", redirectToLogin);
        }

        startPage();
      }
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", mountResetPage, { once: true });
      } else {
        mountResetPage();
      }
    })();
  </script>

  <style>

      --site-accent-rgb:92,94,191;
      --site-accent-runtime:#5c5ebf;

    #resetInline .sr-only-username,#resetInline .field-label{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;clip-path:inset(50%)!important;white-space:nowrap!important;border:0!important;pointer-events:none!important}
    #resetInline .meta-row{display:flex;align-items:center;min-height:20px;margin:0 4px 4px}
    #resetInline .strength{font-size:.8rem;font-weight:600;color:var(--muted)}
    #resetInline .strength[data-level="medium"]{color:var(--link)}
    #resetInline .strength[data-level="strong"]{color:var(--success-text)}
    #resetInline .btn{width:100%;height:56px;min-height:56px;border:0;border-radius:999px;cursor:pointer;font:inherit;font-size:1rem;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;line-height:1.3;padding:0 18px;text-decoration:none}
    #resetInline .btn-primary{margin-top:4px;background:var(--site-action-fill-dark);color:#ffffff;box-shadow:0 12px 26px rgba(var(--site-accent-rgb),.38);text-shadow:0 1px 0 rgba(0,0,0,.22);filter:saturate(1.2)}
    #resetInline .btn-primary:hover{filter:brightness(1.08) saturate(1.28)}
    #resetInline .btn:disabled{cursor:wait;opacity:.65}
    #resetInline .btn-secondary{background:transparent;color:var(--muted);box-shadow:none;font-size:.88rem}
    #resetInline .btn-secondary:hover{color:var(--text)}
    #resetInline .status-wrap{display:flex;justify-content:center;margin-bottom:8px}
    #resetInline .status-pill{color:var(--muted);font-size:.9rem;font-weight:600;line-height:1.8;text-align:center}
    #resetInline .status-pill[data-tone="success"]{color:var(--success-text)}
    #resetInline .message{display:none;font-size:.95rem;line-height:1.9;text-align:center}
    #resetInline .message.show{display:block}
    #resetInline .message.success{color:var(--success-text)}
    #resetInline .reset-success-page{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;max-width:420px;min-height:calc(100dvh - var(--app-header-offset,68px));margin:0 auto;padding:28px 20px 48px;text-align:center;background:transparent;border:0;box-shadow:none;outline:none}
    #resetInline .reset-success-illus{display:block;width:88px;height:88px;margin:0 auto 26px;color:#16a34a}
    #resetInline#resetInline .reset-success-title{margin:0 0 24px;font-size:1.7rem;font-weight:900;line-height:1.28;color:var(--text)!important}
    #resetInline .reset-success-actions{width:100%}
    #resetInline .reset-success-actions .btn-primary{margin:0;background:var(--primary);box-shadow:none;filter:none;font-size:1.06rem;font-weight:800;text-shadow:none}
    #resetInline .reset-success-actions .btn-primary:focus-visible{outline:2px solid var(--primary);outline-offset:4px}
    #resetInline .hidden{display:none!important}
    @media(max-width:640px){#resetInline .auth-page{padding:14px 10px 18px}#resetInline .form-side{padding:52px 0 18px}}
    @media(max-width:480px){#resetInline .reset-success-page{padding:20px 16px 40px}#resetInline#resetInline .reset-success-title{font-size:1.46rem}}
  </style>
</head>
<body>
  <div id="headerContainer"></div>
  <div id="sidebarContainer"></div>

  <main id="resetInline">
    <div class="auth-page" id="resetFormPage">
      <div class="auth-shell">
        <section class="form-side">
          <header class="header header--simple">
            <h2>تغيير كلمة المرور</h2>
          </header>

          <div class="card">
            <div class="status-wrap" id="statusWrap">
              <span class="status-pill" id="statusBadge" data-tone="loading">جاري التحقق من الرابط...</span>
            </div>

            <div class="login-box">
              <div class="account-chip hidden" id="emailChip">
                <i class="fa-regular fa-envelope"></i>
                <strong id="emailValue">...</strong>
              </div>

              <div class="message error" id="errorBox"></div>

              <form id="resetForm" class="stack hidden" novalidate>
                <input id="resetEmailHidden" class="sr-only-username" type="email" name="username" autocomplete="username email">
                <label class="field-label" for="newPassword">كلمة المرور الجديدة</label>
                <div class="input-group">
                  <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" placeholder="أدخل كلمة المرور الجديدة">
                  <i class="fa-solid fa-lock"></i>
                  <button class="field-toggle" type="button" data-toggle-target="newPassword" aria-label="إظهار كلمة المرور" title="إظهار كلمة المرور" aria-pressed="false"><i class="fa-regular fa-eye"></i></button>
                </div>

                <div class="input-group">
                  <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" placeholder="أعد كتابة كلمة المرور">
                  <i class="fa-solid fa-shield-halved"></i>
                  <button class="field-toggle" type="button" data-toggle-target="confirmPassword" aria-label="إظهار كلمة المرور" title="إظهار كلمة المرور" aria-pressed="false"><i class="fa-regular fa-eye"></i></button>
                </div>

                <div class="meta-row">
                  <span class="strength" id="strengthText" data-level="weak">قوة كلمة المرور: ضعيفة</span>
                </div>

                <div class="stack">
                  <button class="btn btn-primary" id="submitBtn" type="submit">حفظ كلمة المرور الجديدة</button>
                  <button class="btn btn-secondary" id="backLoginBtn" type="button">العودة لتسجيل الدخول</button>
                </div>
              </form>

            </div>
          </div>
        </section>
      </div>
    </div>
    <section id="resetSuccessPage" class="reset-success-page hidden" role="region" aria-labelledby="resetSuccessTitle" tabindex="-1">
      <svg class="reset-success-illus" viewBox="0 0 88 88" fill="none" aria-hidden="true" focusable="false">
        <circle cx="44" cy="44" r="42" fill="currentColor"/>
        <path d="m26 44 12 12 25-25" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h1 class="reset-success-title" id="resetSuccessTitle">تم تغيير كلمة السر بنجاح</h1>
      <div class="reset-success-actions hidden" id="successActions">
        <button class="btn btn-primary" id="successLoginBtn" type="button">التوجه لتسجيل الدخول</button>
      </div>
    </section>
  </main>


</body>
</html>
